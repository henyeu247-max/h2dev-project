    function openTab(id, extra, pushHistory = true) {
      state.tab = id || 'tongquan';

      // còn sót từ tab trước (ví dụ skuFilter từ Ngách xanh) để không rơi vào trạng thái 0/tổng.
      if (state.tab === 'video' && !(extra && extra.skuFilter)) {
        state.skuFilter = '';
        state.nicheFilter = '';
        state.marketFilter = '';
        state.q = '';
        state.freeOnly = false;
        state.watchFilter = '';
      }
      if (extra) Object.assign(state, extra);
      if (pushHistory) {
        try {
          const cleanPath = (state.tab === 'tongquan') ? '/' : ('/' + state.tab);
          const url = new URL(cleanPath, location.origin);
          if (state.marketFilter) url.searchParams.set('market', state.marketFilter);
          if (state.nicheFilter) url.searchParams.set('niche', state.nicheFilter);
          history.pushState({ tab: state.tab, market: state.marketFilter, niche: state.nicheFilter }, '', url.pathname + url.search);
        } catch (e) {}
      }
      renderTabs();
      render();
    }

    function fmtBytes(n) { if (!n) return ''; if (n > 1e9) return (n / 1e9).toFixed(2) + ' GB'; if (n > 1e6) return (n / 1e6).toFixed(0) + ' MB'; return (n / 1e3).toFixed(0) + ' KB'; }

    async function hydrateAdminState() {
      try {
        const r = await fetch('/api/admin-state', { cache: 'no-store' });
        if (!r.ok) return;
        const s = await r.json();
        const curW = loadWatched();
        const remoteW = (s.watched && typeof s.watched === 'object') ? s.watched : {};
        const mergedW = Object.assign({}, remoteW);
        for (const k in curW) {
          if (!mergedW[k]) {
            mergedW[k] = curW[k];
          } else {
            mergedW[k] = {
              watched: Boolean(curW[k].watched || mergedW[k].watched),
              t: Math.max(curW[k].t || 0, mergedW[k].t || 0),
              d: Math.max(curW[k].d || 0, mergedW[k].d || 0),
              note: curW[k].note || mergedW[k].note || ''
            };
          }
        }
        localStorage.setItem('h2dev-watched', JSON.stringify(mergedW));

        const curF = JSON.parse(localStorage.getItem('h2dev-fav') || '[]');
        const remoteF = Array.isArray(s.favorites) ? s.favorites : [];
        const favSet = new Set([...remoteF, ...(Array.isArray(curF) ? curF : [])].filter(Boolean));
        localStorage.setItem('h2dev-fav', JSON.stringify([...favSet]));

        if (s.recent && !localStorage.getItem('h2dev-recent')) {
          localStorage.setItem('h2dev-recent', JSON.stringify(s.recent));
        }
        localStorage.setItem('h2dev-admin', JSON.stringify(Object.assign({}, s, { watched: mergedW, favorites: [...favSet] })));
      } catch (e) {}
    }
    function watchedBadge(sku) {
      const w = loadWatched()[sku];
      if (!w) return '';
      const d = Number(w.d) || 0, t = Number(w.t) || 0;
      const ratio = (d > 0 && t > 0) ? Math.min(1, t / d) : 0;
      const done = Boolean(w.watched) || ratio >= 0.95;
      if (done) return `<span class="badge badge-green" title="Đã xem hết">✓ Đã xem</span>`;
      if (ratio > 0.02) return `<span class="badge badge-amber" title="Đang xem dở ${Math.round(ratio * 100)}% — Xem tiếp">Dở ${Math.round(ratio * 100)}%</span>`;
      return '';
    }
    function watchedProgress(sku) {
      const w = loadWatched()[sku];
      if (!w) return '';
      const d = Number(w.d) || 0, t = Number(w.t) || 0;
      const ratio = (d > 0 && t > 0) ? Math.min(100, Math.round(t / d * 100)) : 0;
      if (ratio <= 0) return '';
      return `<div class="absolute bottom-0 left-0 right-0 h-1 bg-ink-900/80"><div class="h-full bg-brand-500" style="width:${ratio}%"></div></div>`;
    }
    function watchedResumeLabel(sku) {
      const w = loadWatched()[sku];
      if (!w) return '';
      const d = Number(w.d) || 0, t = Number(w.t) || 0;
      const ratio = (d > 0 && t > 0) ? Math.min(1, t / d) : 0;
      if (w.watched || ratio >= 0.95) return '';
      if (ratio > 0.02) { const m = Math.floor(t / 60), s = Math.floor(t % 60); return `Xem tiếp (${m}:${String(s).padStart(2, '0')})`; }
      return '';
    }

    const BOTTOM_TABS = ['tongquan', 'video', 'ngachxanh', 'kenh', 'rawkenh', 'chienluoc'];
    function tabMarkup(t, extraId) {
      const selected = state.tab === t.id;
      const id = extraId || `tab-${t.id}`;
      const isBottom = extraId && extraId.startsWith('m-tab-');
      const label = isBottom ? (t.short || t.name) : t.name;
      return `<button id="${id}" type="button" role="tab" aria-selected="${selected ? 'true' : 'false'}" aria-controls="content" tabindex="${selected ? '0' : '-1'}" class="tab-btn${selected ? ' active' : ''}" data-tab="${t.id}" title="${t.name}">${t.icon}<span>${label}</span></button>`;

    function bindTabButton(b) {
      b.onclick = () => {
        openTab(b.dataset.tab);
      };
      b.onkeydown = (e) => {
        if (e.key === 'ArrowRight' || e.key === 'ArrowDown' || e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
          e.preventDefault();
          const tabs = [...document.querySelectorAll('#tabs .tab-btn')];
          const index = tabs.indexOf(b);
          if (index < 0) return;
          const next = (index + (e.key === 'ArrowRight' || e.key === 'ArrowDown' ? 1 : -1) + tabs.length) % tabs.length;
          tabs[next].focus(); tabs[next].click();
        }
      };
    }
    function renderTabs() {
      const nav = document.getElementById('tabs');
      const bottom = document.getElementById('bottom-nav');
      const mobile = document.getElementById('mobile-tabs');
      nav.innerHTML = TABS.map(t => tabMarkup(t)).join('');
      nav.querySelectorAll('.tab-btn').forEach(bindTabButton);
      if (bottom) {
        const mainBottom = TABS.filter(t => BOTTOM_TABS.includes(t.id));
        const overflowTabs = TABS.filter(t => !BOTTOM_TABS.includes(t.id));
        const isOverflowActive = overflowTabs.some(t => t.id === state.tab);
        const moreIcon = `<svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>`;
        const moreBtnHtml = `<button id="m-tab-more" type="button" role="tab" aria-selected="${isOverflowActive ? 'true' : 'false'}" aria-controls="content" class="tab-btn${isOverflowActive ? ' active' : ''}" title="Mục khác">${moreIcon}<span>Khác</span></button>`;

        bottom.innerHTML = mainBottom.map(t => tabMarkup(t, `m-tab-${t.id}`)).join('') + moreBtnHtml;
        bottom.querySelectorAll('.tab-btn:not(#m-tab-more)').forEach(bindTabButton);

        const moreBtn = document.getElementById('m-tab-more');
        if (moreBtn) {
          moreBtn.onclick = (e) => {

            toggleMoreMenu(overflowTabs);

        }

    function toggleMoreMenu(overflowTabs) {
      let sheet = document.getElementById('moreMenuSheet');
      let backdrop = document.getElementById('moreMenuBackdrop');
      if (sheet) {
        sheet.remove();
        if (backdrop) backdrop.remove();
        return;
      }
      backdrop = document.createElement('div');
      backdrop.id = 'moreMenuBackdrop';
      backdrop.className = 'more-menu-backdrop';
      backdrop.onclick = () => { sheet?.remove(); backdrop?.remove(); };
      document.body.appendChild(backdrop);

      sheet = document.createElement('div');
      sheet.id = 'moreMenuSheet';
      sheet.className = 'more-menu-sheet';
      sheet.innerHTML = overflowTabs.map(t => {
        const sel = state.tab === t.id;
        return `<button type="button" class="more-item${sel ? ' active font-bold' : ''}" data-tab="${t.id}">${t.icon}<span>${t.name}</span></button>`;

          renderTabs();
          render();

    function buildVideoSearchSuggestions(query) {
      if (!query || !query.trim()) return [];
      const q = query.trim().toLowerCase();
      const videos = window._allVideos || [];
      const insights = window._videoInsights || {};
      const suggestions = [];
      const seenKeys = new Set();

      for (const v of videos) {
        const sku = v.sku;
        const ins = insights[sku] || {};
        const title = v.title || '';
        const actualTopic = ins.actual_topic || '';
        const niche = v.contentNiche || v.niche || ins.niche_primary || '';

        // 1. Match Video Title / SKU / Actual Topic
        if (title.toLowerCase().includes(q) || sku.toLowerCase().includes(q) || actualTopic.toLowerCase().includes(q)) {
          const vKey = 'vid:' + sku;
          if (!seenKeys.has(vKey)) {
            seenKeys.add(vKey);
            suggestions.push({
              type: 'lesson',
              icon: '🎓',
              badge: sku,
              badgeColor: 'bg-brand-950/60 text-brand-300 border-brand-800/60',
              title: title,
              sub: `${sku} · ${actualTopic || niche} · ${v.duration || ''}`,
              searchTerm: title,
              sku: sku,
              directUrl: `/lotrinh/${encodeURIComponent(sku)}`,
              btnLabel: 'Xem bài ↗',
              priority: sku.toLowerCase() === q || title.toLowerCase().startsWith(q) ? 100 : 85
            });
          }
        }

        // 2. Match Timestamps (Mốc tua nhanh)
        const timestamps = ins.key_timestamps || [];
        for (const ts of timestamps) {
          const tsTitle = ts.label || ts.title || '';
          const tsTime = ts.time || '';
          if (tsTitle.toLowerCase().includes(q) || tsTime.includes(q)) {
            const tsKey = 'ts:' + sku + ':' + tsTime;
            if (!seenKeys.has(tsKey)) {
              seenKeys.add(tsKey);
              const sec = ts.seconds || 0;
              suggestions.push({
                type: 'timestamp',
                icon: '⏱️',
                badge: tsTime,
                badgeColor: 'bg-sky-950/60 text-sky-300 border-sky-800/60',
                title: `${tsTime} — ${tsTitle}`,
                sub: `Bài học: ${title} (${sku})`,
                searchTerm: tsTitle,
                sku: sku,
                directUrl: `/player.html?sku=${encodeURIComponent(sku)}&t=${sec}`,
                btnLabel: `▶ Tua đến ${tsTime}`,
                priority: 95
              });
            }
          }
        }

        // 3. Match Key Takeaways & Edit SOP
        const takeaways = ins.key_takeaways || [];
        for (const tk of takeaways) {
          if (tk.toLowerCase().includes(q)) {
            const tkKey = 'tk:' + sku + ':' + tk.slice(0, 30);
            if (!seenKeys.has(tkKey)) {
              seenKeys.add(tkKey);
              suggestions.push({
                type: 'takeaway',
                icon: '📌',
                badge: 'Mấu Chốt',
                badgeColor: 'bg-amber-950/60 text-amber-300 border-amber-800/60',
                title: tk,
                sub: `Bài học: ${title} (${sku})`,
                searchTerm: tk.slice(0, 40),
                sku: sku,
                directUrl: `/lotrinh/${encodeURIComponent(sku)}`,
                btnLabel: 'Xem bài ↗',
                priority: 80
              });
            }
          }
        }

        // 4. Match Avoid Flags
        const avoidFlags = ins.avoid_flags || [];
        for (const af of avoidFlags) {
          if (af.toLowerCase().includes(q)) {
            const afKey = 'af:' + sku + ':' + af.slice(0, 30);
            if (!seenKeys.has(afKey)) {
              seenKeys.add(afKey);
              suggestions.push({
                type: 'avoid',
                icon: '⚠️',
                badge: 'Cảnh Báo YPP',
                badgeColor: 'bg-red-950/60 text-red-300 border-red-800/60',
                title: af,
                sub: `Cảnh báo YPP: ${title} (${sku})`,
                searchTerm: af.slice(0, 40),
                sku: sku,
                directUrl: `/lotrinh/${encodeURIComponent(sku)}`,
                btnLabel: 'Xem bài ↗',
                priority: 75
              });
            }
          }
        }

        // 5. Match Channels Mentioned
        const chList = v.channels || [];
        for (const ch of chList) {
          if (ch.toLowerCase().includes(q)) {
            const chKey = 'ch:' + sku + ':' + ch;
            if (!seenKeys.has(chKey)) {
              seenKeys.add(chKey);
              suggestions.push({
                type: 'channel',
                icon: '📺',
                badge: 'Kênh Mẫu',
                badgeColor: 'bg-purple-950/60 text-purple-300 border-purple-800/60',
                title: ch,
                sub: `Được tác giả mổ xẻ trong bài: ${title} (${sku})`,
                searchTerm: ch,
                sku: sku,
                directUrl: `/lotrinh/${encodeURIComponent(sku)}`,
                btnLabel: 'Xem bài ↗',
                priority: 70
              });
            }
          }
        }
      }

      return suggestions.sort((a, b) => b.priority - a.priority).slice(0, 8);
    }

    async function renderVideo() {
      const [rawVideos, rawNx, rawInsights] = await Promise.all([
        loadJSON('data-tabs/videos.json'),
        loadJSON('data-tabs/ngach-xanh.json').catch(() => null),
        loadJSON('data/video_insights.json').catch(() => ({}))
      ]);
      const videos = Array.isArray(rawVideos) ? rawVideos : safeArray(rawVideos && rawVideos.videos);
      window._allVideos = videos;
      window._videoInsights = rawInsights || {};
      const macroToSkus = {};
      if (rawNx && Array.isArray(rawNx.ngachXanh)) {
        rawNx.ngachXanh.forEach(x => {
          const macro = (nicheKeyFor(x.ngach) || x.ngach || '').toLowerCase();
          if (!macroToSkus[macro]) macroToSkus[macro] = new Set();
          (x.skus || []).forEach(s => macroToSkus[macro].add((typeof s === 'string' ? s : (s && s.sku) || '').toLowerCase()));
        });
      }
      const macroSet = new Set(Object.values(NICHE_MAP).map(x => x.toLowerCase()));
      const microNiches = [...new Set(videos.flatMap(v => [v.contentNiche, v.niche].filter(Boolean)))].sort();
      const macroNiches = [...new Set(Object.values(NICHE_MAP))].sort();
      const markets = [...new Set(videos.flatMap(v => v.market || []))];
      let list = videos.filter(v => {
        const ins = (window._videoInsights && window._videoInsights[v.sku]) || {};
        const fullSearchText = [
          v.title || '',
          v.sku || '',
          v.niche || '',
          v.contentNiche || '',
          ins.actual_topic || '',
          ...(ins.key_takeaways || []),
          ...(ins.avoid_flags || []),
          ...(ins.tools_mentioned || []),
          (Array.isArray(ins.edit_sop) ? ins.edit_sop.join(' ') : (typeof ins.edit_sop === 'string' ? ins.edit_sop : (ins.edit_sop?.primary || '') + ' ' + ((ins.edit_sop?.additional || []).join(' ')))),
          ...((ins.key_timestamps || []).map(t => (t.time || '') + ' ' + (t.title || ''))),
          ...((v.channels || []))
        ].join(' ').toLowerCase();

        if (state.q && !fullSearchText.includes(state.q.toLowerCase())) return false;
        if (state.skuFilter) {
          const allow = new Set(String(state.skuFilter).split(',').map(s => s.trim().toLowerCase()).filter(Boolean));
          if (allow.size && !allow.has(String(v.sku || '').toLowerCase())) return false;
        } else if (state.nicheFilter) {
          const target = state.nicheFilter.trim().toLowerCase();
          const isMacro = macroSet.has(target);
          const vNiche = (v.contentNiche || v.niche || '').trim().toLowerCase();
          const vKey = (nicheKeyFor(v.contentNiche || v.niche || '') || '').trim().toLowerCase();
          const vSku = (v.sku || '').trim().toLowerCase();
          const allowedSkus = macroToSkus[target] || new Set();
          if (isMacro) {
            const matched = (vKey === target) || (vNiche === target) || (vNiche.includes(target)) || allowedSkus.has(vSku);
            if (!matched) return false;
          } else {
            const matched = (vNiche === target) || (vNiche.includes(target)) || (target.includes(vNiche)) || allowedSkus.has(vSku);
            if (!matched) return false;
          }
        }
        if (state.marketFilter && !(v.market || []).includes(state.marketFilter)) return false;
        if (state.freeOnly && !v.free) return false;
        if (state.watchFilter) {
          const w = loadWatched()[v.sku];
          const ratio = (w && w.d && w.t) ? w.t / w.d : 0;
          const done = (w && (w.watched || ratio >= 0.95));
          // "Chưa xem" = mọi video chưa đạt đã xem (gồm cả đang xem dở)
          if (state.watchFilter === 'watched' && !done) return false;
          if (state.watchFilter === 'unwatched' && done) return false;
        }
        return true;
      });
      // Sắp xếp: mới nhất (mặc định) / theo ngách / theo thị trường
      if (state.sortBy === 'niche') {
        list = list.slice().sort((a, b) => {
          const na = a.contentNiche || a.niche || '';
          const nb = b.contentNiche || b.niche || '';
          return na.localeCompare(nb) || (a.published_at || '').localeCompare(b.published_at || '');
        });
      } else if (state.sortBy === 'market') {
        list = list.slice().sort((a, b) => {
          const ma = (a.market || []).join(',');
          const mb = (b.market || []).join(',');
          return ma.localeCompare(mb) || (a.published_at || '').localeCompare(b.published_at || '');
        });
      } else {
        list = list.slice().sort((a, b) => (b.published_at || '').localeCompare(a.published_at || ''));
      }
      const free = videos.filter(v => v.free).length;
      const withDocs = videos.filter(v => v.docs && v.docs.length).length;
      const newest = videos[0] && videos[0].published_at;
      return `
  ${pageBanner('Video', list.length + '/' + videos.length + ' · mới nhất trước', [
        { icon: ICONS.video, label: 'Tổng video', value: videos.length, sub: newest ? 'Mới nhất ' + newest : '' },
        { icon: ICONS.doc, label: 'Free', value: free, sub: (videos.length - free) + ' pro' },
        { icon: ICONS.doc, label: 'Có tài liệu', value: withDocs, sub: 'docs[] catalog' },
        { icon: ICONS.video, label: 'Đang hiện', value: list.length, sub: list.length === videos.length ? 'Không lọc' : 'Đang filter' }
      ])}

    async function renderNgachXanh() {
      const nx = await loadJSON('data-tabs/ngach-xanh.json');
      const rawVideos = await loadJSON('data-tabs/videos.json');
      const videos = Array.isArray(rawVideos) ? rawVideos : safeArray(rawVideos && rawVideos.videos);

      function vidsFor(n) {
        const bySku = new Map(videos.map(v => [String(v.sku || '').toLowerCase(), v]));
        const out = [];
        const seen = new Set();
        function add(v) {
          if (!v || seen.has(v.sku)) return;
          seen.add(v.sku);
          out.push(v);
        }
        for (const ref of (n && n.skus) || []) {
          const sku = typeof ref === 'string' ? ref : (ref && ref.sku);
          add(bySku.get(String(sku || '').toLowerCase()));
        }
        const handles = new Set(((n && n.mauSach) || []).map(h => String(h).toLowerCase()));
        if (handles.size) {
          for (const v of videos) {
            if ((v.channels || []).some(c => handles.has(String(c).toLowerCase()))) add(v);
          }
        }
        return out;
      }

      function videoRow(v, extraClass, extraAttr) {
        const docs = safeArray(v.docs);
        const channels = safeArray(v.channels);
        return `<a href="/lotrinh/${encodeURIComponent(v.sku)}" class="flex gap-2.5 p-2 rounded-xl hover:bg-ink-700/60 border border-transparent hover:border-ink-600 transition-colors group min-w-0 ${extraClass || ''}" ${extraAttr || ''}>
      <img src="${esc(v.image || 'assets/thumbs/placeholder.svg')}" alt="Thumbnail bài học: ${esc(v.title)}" width="72" height="40" loading="lazy" decoding="async" onerror="this.onerror=null;this.src='assets/thumbs/placeholder.svg'" class="w-[72px] h-[40px] rounded-xl object-cover shrink-0 bg-black">
      <div class="min-w-0 flex-1">
        <div class="text-xs font-medium text-white leading-snug line-clamp-2 group-hover:text-brand-200 transition-colors break-words">${esc(v.title)}</div>
        <div class="flex items-center flex-wrap gap-x-2 gap-y-0.5 mt-1">
          <span class="text-[10px] text-gray-500 font-mono truncate">${esc(v.sku)}</span>
          ${v.published_at ? `<span class="text-[10px] text-gray-400 shrink-0">${esc(v.published_at)}</span>` : ''}
          <span class="text-[10px] text-gray-400">${fmtBytes(v.size)}</span>
          ${docs.length ? '<span class="text-[10px] text-brand-400 shrink-0"><span aria-hidden="true">📄</span> ' + docs.length + '</span>' : ''}
          ${channels.length ? '<span class="text-[10px] text-sky-400 shrink-0"><span aria-hidden="true">📺</span> ' + channels.length + '</span>' : ''}
        </div>
      </div>
      <span class="shrink-0 w-7 h-7 rounded-xl bg-brand-600 group-hover:bg-brand-500 text-white flex items-center justify-center text-xs transition-colors">→</span>
    </a>`;
      }
      function nxRpmShort(field) {
        const raw = String(field || '').trim();
        const match = raw.match(/median\s*\$?\s*(\d+(?:\.\d+)?)/i) || raw.match(/\$(\d+(?:\.\d+)?)/);
        return match ? '$' + match[1] : 'Chưa đo';
      }
      function nxCompShort(field) {
        const raw = String(field || '').trim();
        const matches = [...raw.matchAll(/competition\s*[:=]?\s*(\d+(?:\.\d+)?)/gi)];
        return matches.length ? matches[matches.length - 1][1] : 'Chưa đo';
      }


      const audit = nx.auditTong2026 || {};
      const auditRows = safeArray(audit.xepHang);
      const ngachList = safeArray(nx.ngachXanh);

      // Merge ranked items with their rich details
      const enrichedNiches = auditRows.map(r => {
        const detail = (r.record != null && r.record < ngachList.length) ? ngachList[r.record] : {};
        const rawMarket = safeArray(detail.thiTruong);
        let mTag = 'GLOBAL';
        const nameLower = (r.ngach + ' ' + rawMarket.join(' ')).toLowerCase();
        // Fix 16/09: /\ben\b/ + /\bus\b/ (word boundary) — trước đây /en/ khớp chữ "sEnior"
        // làm 3 ngách Nhật/Hàn bị gắn nhầm tag 🇺🇸 US.
        if (/\bus\b|\ben\b|tiếng anh|mỹ|quốc tế/.test(nameLower)) mTag = 'US';
        else if (/jp|nhật|japan/.test(nameLower)) mTag = 'JP';
        else if (/kr|hàn|korea|야담/.test(nameLower)) mTag = 'KR';
        else if (/vn|việt nam|vietnam/.test(nameLower)) mTag = 'VN';

        return {
          rank: r.thuTu,
          recordId: r.record,
          name: r.ngach,
          tier: r.nhom || 'KHONG_DU_EVIDENCE',
          thesis: r.lyDo || detail.evidence || '',
          videoNote: r.lienKetVideo || '',
          marketTag: mTag,
          markets: rawMarket.length ? rawMarket : [mTag],
          rpm: detail.rpm || '',
          competition: detail.canhTranh || '',
          rpmShort: nxRpmShort(detail.rpm),
          competitionShort: nxCompShort(detail.canhTranh),
          novelty: detail.doMoi || '',
          safeFormat: detail.formatBrand || detail.lamDuoc || 'Sản xuất kịch bản có thesis/nguồn tài liệu kiểm chứng riêng biệt.',
          avoidTrap: detail.viPham || 'Tránh lặp template, không quote-farm, không mạo danh chuyên gia.',
          channels: safeArray(detail.mauSach),
          vids: vidsFor(detail),
          rawDetail: detail
        };
      });

      // Filter statistics
      const tierCounts = { ALL: enrichedNiches.length, UU_TIEN_SAN_XUAT: 0, WATCHLIST: 0, TEST_FORMAT: 0, KHONG_DU_EVIDENCE: 0, TACH_KHOI_DE_XUAT: 0 };
      const marketCounts = { ALL: enrichedNiches.length, US: 0, JP: 0, KR: 0, VN: 0, GLOBAL: 0 };
      enrichedNiches.forEach(n => {
        if (tierCounts[n.tier] != null) tierCounts[n.tier]++;
        if (marketCounts[n.marketTag] != null) marketCounts[n.marketTag]++;
      });

      // Apply Filters
      const q = (state.nxQ || '').trim().toLowerCase();
      const filtered = enrichedNiches.filter(n => {
        if (state.nxTier && n.tier !== state.nxTier) return false;
        if (state.nxMarket && n.marketTag !== state.nxMarket) return false;
        if (!q) return true;
        const hay = [n.name, n.thesis, n.safeFormat, n.avoidTrap, n.marketTag, n.markets.join(' '), n.channels.join(' '), n.vids.map(v=>v.sku+' '+v.title).join(' ')].join(' ').toLowerCase();
        return hay.includes(q);
      });

      const tierLabels = {
        UU_TIEN_SAN_XUAT: 'Ưu tiên sản xuất',
        WATCHLIST: 'Watchlist',
        TEST_FORMAT: 'Test format',
        KHONG_DU_EVIDENCE: 'Chưa đủ evidence',
        TACH_KHOI_DE_XUAT: 'Tách khỏi đề xuất'
      };

      const tierBadges = {
        UU_TIEN_SAN_XUAT: 'badge-green',
        WATCHLIST: 'badge-amber',
        TEST_FORMAT: 'badge-blue',
        KHONG_DU_EVIDENCE: 'badge-muted',
        TACH_KHOI_DE_XUAT: 'badge-red'
      };

      const marketLabels = {
        US: 'US / Tiếng Anh',
        JP: 'Nhật Bản',
        KR: 'Hàn Quốc',
        VN: 'Việt Nam',
        GLOBAL: 'Toàn cầu / Khác'
      };
      return `
  ${pageBanner('Nhận định Ngách xanh 2026', 'Bản đồ 34 ngách YouTube, định dạng an toàn (Safe Format), rủi ro chính sách (Policy Flags) và kênh đối thủ đã kiểm chứng 30 ngày.', [
        { icon: ICONS.niche, label: 'Ưu tiên sản xuất', value: tierCounts.UU_TIEN_SAN_XUAT, sub: 'Top 1-8 ngách sạch, demand thực, RPM cao' },
        { icon: ICONS.doc, label: 'Watchlist & Test', value: (tierCounts.WATCHLIST + tierCounts.TEST_FORMAT), sub: 'Kiểm soát format & test nhỏ 5-10 video' },
        { icon: ICONS.channel, label: 'Kênh mẫu sạch', value: '70 / 70', sub: 'Đã check 30 ngày qua vidIQ API' },
        { icon: ICONS.strategy, label: 'RPM Benchmark', value: '$10.22', sub: 'Median danh mục Education & Science (AIR)' }
      ])}

  <!-- BỘ LỌC TINH GỌN (COMPACT RADAR FILTER) -->

    async function renderNguonReup() {
      const nguon = await loadJSON('data-tabs/nguon-reup.json');
      const videos = await loadJSON('data-tabs/videos.json');
      const bySku = Object.fromEntries(videos.map(v => [v.sku, v]));
      const TYPE_LABEL = { bilibili: 'Bilibili', douyin: 'Douyin', stock: 'Stock footage', tool: 'Tool / Web', community: 'Cộng đồng', other: 'Khác' };
      const TYPE_BADGE = { bilibili: 'badge-blue', douyin: 'badge-amber', stock: 'badge-green', tool: 'badge-brand', community: 'badge-muted', other: 'badge-muted' };
      const TYPE_ORDER = ['bilibili', 'douyin', 'stock', 'tool', 'community', 'other'];
      function hostOf(link) {
        try { return new URL(link).hostname.replace(/^www\./, ''); } catch (e) { return ''; }
      }
      function classifySource(item) {
        const host = hostOf(item.link);
        const blob = ((item.name || '') + ' ' + host + ' ' + (item.link || '')).toLowerCase();
        if (/bilibili/.test(blob)) return 'bilibili';
        if (/douyin|tikvideo/.test(blob)) return 'douyin';
        if (/pexels|vecteezy|coverr|freepik|pixabay/.test(blob)) return 'stock';
        if (/h2devtool|youtube-transcript|tikvideo/.test(blob)) return 'tool';
        if (/zalo|facebook|group|cộng đồng/.test(blob)) return 'community';
        return 'other';
      }
      function inferNiche(item, video) {
        const t = ((item.name || '') + ' ' + (item.link || '')).toLowerCase();
        if (/health|sức khỏe/.test(t)) return 'Sức khỏe / Lão hóa';
        if (/bilibili|douyin|reup|hoạt hình/.test(t)) return 'Reup / Hoạt hình';
        if (/kịch bản|transcript/.test(t)) return 'Nền tảng / Tool';
        if (video && video.niche && video.niche !== 'Khác') return video.niche;
        return 'Khác';
      }
      function cleanTitle(item) {
        const raw = String(item.name || '').trim();
        if (!raw || /^https?:\/\//i.test(raw)) {
          const host = hostOf(item.link);
          const type = classifySource(item);
          if (type === 'bilibili') return 'Kênh nguồn Bilibili';
          if (type === 'douyin') return 'Kênh nguồn Douyin';
          if (type === 'stock') return host ? ('Stock · ' + host) : 'Stock footage';
          if (type === 'tool') return host ? ('Công cụ · ' + host) : 'Công cụ';
          return host || 'Nguồn reup';
        }
        return raw.replace(/\s*\((tặng kèm|mọi người có thể tự tìm thêm[^)]*)\)/gi, '').replace(/\s{2,}/g, ' ').trim();
      }
      const enriched = nguon.map((item, idx) => {
        const video = bySku[item.sku];
        const type = classifySource(item);
        return Object.assign({}, item, {
          _i: idx,
          type,
          host: hostOf(item.link),
          title: cleanTitle(item),
          videoTitle: video ? video.title : '',
          videoNiche: video ? video.niche : '',
          contentNiche: inferNiche(item, video)

    function highlightQuery(text, query) {
      if (!text || !query) return esc(text || '');
      const cleanQ = query.trim();
      if (!cleanQ) return esc(text);
      const escapedQ = cleanQ.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      const regex = new RegExp(`(${escapedQ})`, 'gi');
      const safeText = esc(text);
      return safeText.replace(regex, '<mark class="bg-brand-500/35 text-brand-200 px-0.5 rounded font-bold">$1</mark>');
    }

    function buildRawSearchSuggestions(query) {
      if (!query || !query.trim()) return [];
      const q = query.trim().toLowerCase();
      const records = window._rawKenhRecords || [];
      const suggestions = [];
      const seenKeys = new Set();

      for (const r of records) {
        const ch = r.channel || {};
        const ocr = r.ocr || {};
        const vision = r.visionAnalysis || {};
        const chTitle = ch.title || vision.channelName || r.id;
        const handle = ch.handle || vision.handle || '';
        const rid = r.id || '';
        const niche = r.editorialNiche || r.niche || '';
        const demoVid = r.featuredDemoVideo || {};

        // 1. Check Channel & Handle & RAW ID Match
        const chKey = 'ch:' + rid;
        if (!seenKeys.has(chKey)) {
          if (chTitle.toLowerCase().includes(q) || handle.toLowerCase().includes(q) || rid.toLowerCase().includes(q)) {
            seenKeys.add(chKey);
            suggestions.push({
              type: 'channel',
              icon: '📺',
              badge: rid,
              badgeColor: 'bg-red-950/60 text-red-300 border-red-800/60',
              title: chTitle,
              sub: `${handle ? handle + ' · ' : ''}${niche}${ch.subscribers ? ' · ' + Number(ch.subscribers).toLocaleString() + ' subs' : ''}`,
              searchTerm: chTitle,
              rawId: rid,
              priority: rid.toLowerCase() === q || chTitle.toLowerCase().startsWith(q) ? 100 : 80
            });
          }
        }

        // 2. Check Demo Video Match
        if (demoVid.title && demoVid.title.toLowerCase().includes(q)) {
          const vidKey = 'vid:' + (demoVid.videoId || demoVid.title);
          if (!seenKeys.has(vidKey)) {
            seenKeys.add(vidKey);
            suggestions.push({
              type: 'video',
              icon: '🎬',
              badge: 'Demo Tuyến',
              badgeColor: 'bg-blue-950/60 text-blue-300 border-blue-800/60',
              title: demoVid.title,
              sub: `Kênh: ${chTitle} (${rid})${demoVid.views ? ' · ' + Number(demoVid.views).toLocaleString() + ' views' : ''}`,
              searchTerm: demoVid.title,
              rawId: rid,
              priority: 90
            });
          }
        }

        // 3. Check OCR Video Rows & Vision Titles
        const ocrRows = (ocr && Array.isArray(ocr.videoRows)) ? ocr.videoRows : [];
        for (const row of ocrRows) {
          if (row.title && row.title.toLowerCase().includes(q)) {
            const vidKey = 'vid:' + row.title;
            if (!seenKeys.has(vidKey)) {
              seenKeys.add(vidKey);
              suggestions.push({
                type: 'video',
                icon: '🎬',
                badge: row.viewsText || 'Video Raw',
                badgeColor: 'bg-emerald-950/60 text-emerald-300 border-emerald-800/60',
                title: row.title,
                sub: `Kênh: ${chTitle} (${rid}) · ${niche}`,
                searchTerm: row.title,
                rawId: rid,
                priority: 70
              });
            }
          }
        }

        // 4. Check Niche Match
        if (niche && niche.toLowerCase().includes(q)) {
          const nKey = 'niche:' + niche;
          if (!seenKeys.has(nKey)) {
            seenKeys.add(nKey);
            suggestions.push({
              type: 'niche',
              icon: '🏷️',
              badge: 'Ngách',
              badgeColor: 'bg-purple-950/60 text-purple-300 border-purple-800/60',
              title: niche,
              sub: 'Lọc toàn bộ kênh mẫu thuộc ngách này',
              searchTerm: niche,
              rawId: null,
              priority: 60
            });
          }
        }
      }

      return suggestions.sort((a, b) => b.priority - a.priority).slice(0, 7);
    }

    async function renderKenh() {
      const kenh = await loadJSON('data-tabs/kenh-mau.json');
      const NICHE_ORDER = ['Triết lý / Tâm linh', 'Sức khỏe / Lão hóa', 'Kinh tế / Tài chính', 'Khoa học EN', 'Reup / Hoạt hình', 'Drama / Stories', 'Lịch sử / Quân sự', 'Everyday History EN (lịch sử đồ vật thường ngày)', 'Edit / Thumb', 'Nhân bản / Kênh', 'Share key / Ngách nhỏ', 'Kiếm tiền / Chính sách', 'Hệ thống / Quy trình', 'Nền tảng / Tool', 'Khác'];
      function initial(handle) {
        const t = String(handle || '').replace(/^@/, '').trim();
        return (t[0] || '?').toUpperCase();
      }
      function avatarHtml(ch) {
        if (ch.avatar) {
          return `<img src="${esc(ch.avatar)}" alt="${esc(ch.handle || ch.name || 'Kênh')}" class="w-11 h-11 rounded-xl object-cover shrink-0 bg-ink-700" loading="lazy" decoding="async" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"><div class="w-11 h-11 rounded-xl bg-brand-600/25 text-brand-200 font-bold text-sm items-center justify-center shrink-0 hidden">${esc(initial(ch.handle))}</div>`;
        }
        return `<div class="w-11 h-11 rounded-xl bg-brand-600/25 text-brand-200 font-bold text-sm flex items-center justify-center shrink-0">${esc(initial(ch.handle))}</div>`;
      }
      const nicheCounts = kenh.reduce((a, x) => { const n = x.niche || 'Khác'; a[n] = (a[n] || 0) + 1; return a; }, {});
      const q = (state.kenhQ || '').trim().toLowerCase();
      const list = kenh.filter(ch => {
        if (ch.dead) return false;
        if (state.kenhNiche && (ch.niche || 'Khác') !== state.kenhNiche) return false;
        if (!q) return true;
        const hay = [ch.handle, ch.niche, (ch.niches || []).join(' '), (ch.markets || []).join(' '), ch.url].join(' ').toLowerCase();
        return hay.includes(q);
      }).slice().sort((a, b) => (b.count || 0) - (a.count || 0));
      const allKenhNiches = [...NICHE_ORDER.filter(n => nicheCounts[n]), ...Object.keys(nicheCounts).filter(n => !NICHE_ORDER.includes(n))];
      const chips = allKenhNiches.map(n => [n, n, nicheCounts[n]]);
      const grouped = [];
      allKenhNiches.forEach(n => {
        const items = list.filter(x => (x.niche || 'Khác') === n);
        if (items.length) grouped.push({ niche: n, items });
      });
      function videoNicheKey(niche) {
        return NICHE_MAP[niche] || (Object.values(NICHE_MAP).includes(niche) ? niche : (niche && niche !== 'Khác' ? niche : ''));
      }
      return `
  ${pageBanner('Kênh mẫu / Đối thủ', list.length + '/' + kenh.length + ' kênh · nhóm theo ngách từ video H2DEV', [
        { icon: ICONS.channel, label: 'Kênh mẫu', value: kenh.length, sub: list.length === kenh.length ? 'Hiện tất cả' : 'Đang lọc ' + list.length },

        { icon: ICONS.home, label: 'Có avatar', value: kenh.filter(k => k.avatar).length, sub: 'thumb local' },
        { icon: ICONS.link, label: 'Đang hiện', value: list.length, sub: 'sau filter' },
        { icon: ICONS.doc, label: 'Dead 404', value: kenh.filter(k => k.dead).length, sub: 'đã ẩn' }
      ])}
  <div class="card p-4 sm:p-5 mb-5">
    <div class="flex flex-col sm:flex-row gap-3 sm:items-center">
      <label class="sr-only" for="fq">Tìm kênh</label>
      <input id="fq" value="${esc(state.kenhQ)}" placeholder="Tìm theo handle, tên kênh, ngách, thị trường..." class="search-input-premium w-full sm:flex-1 min-w-0" aria-label="Tìm kênh">
      <button type="button" id="freset-kenh" class="shrink-0 bg-surface-2 hover:bg-surface border border-border px-4 py-2.5 rounded-xl text-xs font-semibold text-fg-2 hover:text-fg transition-colors">Reset</button>
    </div>
    <div class="mt-4 pt-3 border-t border-hairline">
      <div class="text-[11px] uppercase tracking-wider text-gray-400 font-semibold mb-2">Ngách đối thủ</div>
      <div class="flex flex-wrap gap-2">
        <button type="button" data-kenh-niche="" class="filter-btn ${!state.kenhNiche ? 'active' : ''}">Mọi ngách · ${kenh.length}</button>
        ${chips.map(([id, label, n]) => `<button type="button" data-kenh-niche="${esc(id)}" class="filter-btn ${state.kenhNiche === id ? 'active' : ''}">${esc(label)} · ${n}</button>`).join('')}
      </div>
    </div>
  </div>
  <div class="space-y-6">
    ${grouped.map(g => {
        const vKey = videoNicheKey(g.niche);
        return `
      <section class="min-w-0">
        <div class="flex flex-wrap items-center gap-2 mb-3">
          <h2 class="text-base font-bold text-white">${esc(g.niche)}</h2>
          <span class="badge badge-muted">${g.items.length} kênh</span>
          ${vKey ? `<button type="button" data-open-niche="${esc(vKey)}" class="text-xs text-brand-400 hover:text-brand-300 font-medium">Xem video ngách →</button>` : ''}
        </div>
        <div class="grid sm:grid-cols-2 xl:grid-cols-3 gap-3 min-w-0">
          ${g.items.map(ch => `
            <a href="${esc(ch.url)}" target="_blank" rel="noopener noreferrer" class="card p-3 flex items-center gap-3 min-w-0 overflow-hidden hover:border-brand-500">
              ${avatarHtml(ch)}
              <div class="min-w-0 flex-1">
                <div class="text-sm font-semibold text-white truncate">${esc(ch.handle)}</div>
                <div class="text-[11px] text-gray-400 truncate">${esc(ch.niche || 'Khác')} · ${ch.count || 1} video H2DEV</div>
                ${(ch.markets && ch.markets.length) ? `<div class="text-[10px] text-gray-500 truncate mt-0.5">${ch.markets.map(esc).join(' · ')}</div>` : ''}
              </div>
              <span class="text-gray-500 shrink-0 text-sm">↗</span>
            </a>`).join('')}
        </div>
      </section>`;
      }).join('') || '<div class="text-gray-400 text-center py-10">Không tìm thấy kênh</div>'}
  </div>`;
    }

          else if (state.tab === 'kenh') state.kenhQ = val;

          else state.q = val;

          // Real-time live suggestions for rawkenh tab

            window.showRawSearchSuggestions(val);
          }
          // Real-time live suggestions for video tab
          if (state.tab === 'video' && window.showVideoSearchSuggestions) {
            window.showVideoSearchSuggestions(val);
          }

          clearTimeout(searchDebounceTimer);
          searchDebounceTimer = setTimeout(() => {
            render();
          }, 200);
        };

        fq.onfocus = () => {
          if (state.tab === 'rawkenh' && fq.value.trim() && window.showRawSearchSuggestions) {
            window.showRawSearchSuggestions(fq.value);
          }
          if (state.tab === 'video' && fq.value.trim() && window.showVideoSearchSuggestions) {
            window.showVideoSearchSuggestions(fq.value);
          }
        };

        let activeSugIdx = -1;
        fq.onkeydown = (e) => {
          const isVideoTab = (state.tab === 'video');
          const boxId = isVideoTab ? 'video-search-suggestions' : 'raw-search-suggestions';
          const rowClass = isVideoTab ? '.js-v-sug-row' : '.js-sug-row';
          const box = document.getElementById(boxId);
          if (!box || box.classList.contains('hidden')) return;
          const rows = box.querySelectorAll(rowClass);
          if (!rows.length) return;

          if (e.key === 'ArrowDown') {
            e.preventDefault();
            activeSugIdx = (activeSugIdx + 1) % rows.length;
            rows.forEach((r, i) => r.classList.toggle('bg-[#1e293b]', i === activeSugIdx));
          } else if (e.key === 'ArrowUp') {
            e.preventDefault();
            activeSugIdx = (activeSugIdx - 1 + rows.length) % rows.length;
            rows.forEach((r, i) => r.classList.toggle('bg-[#1e293b]', i === activeSugIdx));
          } else if (e.key === 'Enter') {
            if (activeSugIdx >= 0 && activeSugIdx < rows.length) {
              e.preventDefault();
              rows[activeSugIdx].click();
            } else {
              box.classList.add('hidden');
            }
          } else if (e.key === 'Escape') {
            box.classList.add('hidden');
          }
        };
      }

      const btnClearRawQ = document.getElementById('btn-clear-raw-q');
      if (btnClearRawQ) {
        btnClearRawQ.onclick = (e) => {
          e.stopPropagation();
          state.rawQ = '';
          const fqEl = document.getElementById('fq');
          if (fqEl) { fqEl.value = ''; fqEl.focus(); }
          const box = document.getElementById('raw-search-suggestions');

    async function render() {
      const el = document.getElementById('content');
      el.setAttribute('aria-busy', 'true');

      // 1. Capture active input & cursor position before re-render
      const activeEl = document.activeElement;
      const activeId = activeEl ? activeEl.id : null;
      let selStart = null, selEnd = null;
      if (activeEl && (activeEl.tagName === 'INPUT' || activeEl.tagName === 'TEXTAREA')) {
        try {
          selStart = activeEl.selectionStart;
          selEnd = activeEl.selectionEnd;
        } catch (e) {}
      }

      try {
        let html = '';
        switch (state.tab) {
          case 'tongquan': html = await renderTongQuan(); break;
          case 'lotrinh':
            html = `<iframe class="learn-frame" title="Lộ trình 12 module" src="/learn.html?embed=1"></iframe>`;
            break;
          case 'video': html = await renderVideo(); break;
          case 'ngachxanh': html = await renderNgachXanh(); break;
          case 'kichban': html = await renderKichBan(); break;
          case 'nguonreup': html = await renderNguonReup(); break;
          case 'kenh': html = await renderKenh(); break;
          case 'rawkenh': html = await renderRawKenh(); break;
          case 'chienluoc': html = await renderChienLuoc(); break;
        }
        el.innerHTML = html;
        const titleEl = document.getElementById('page-title');
        const tabMeta = TABS.find(t => t.id === state.tab);
        if (titleEl && tabMeta) titleEl.textContent = tabMeta.name;
        document.getElementById('panel-root').setAttribute('aria-labelledby', `tab-${state.tab}`);
        bindSearch();
        bindNicheActions();

        // 2. Restore active input focus and cursor position after re-render
        if (activeId) {
          const restored = document.getElementById(activeId);
          if (restored && (restored.tagName === 'INPUT' || restored.tagName === 'TEXTAREA')) {
            restored.focus();
            if (selStart !== null && selEnd !== null) {
              try { restored.setSelectionRange(selStart, selEnd); } catch (e) {}
            }
          }
        }
        document.querySelectorAll('[data-check-id]').forEach(box => {
          box.onchange = () => { saveCheck(box.getAttribute('data-check-id'), box.checked); box.setAttribute('aria-checked', box.checked ? 'true' : 'false'); };

        const [vidsTab, kenh, docs] = await Promise.all([

        const videos = Array.isArray(vidsTab) ? vidsTab : (vidsTab && vidsTab.videos) || [];

        function copyWithFallback(text, btn, successLabel, defaultLabel) {
          function markSuccess() {
            if (btn) {
              btn.textContent = successLabel || '✅ Đã sao chép!';
              setTimeout(() => { btn.textContent = defaultLabel || '📋 Sao chép'; }, 2000);
            }
          }
          if (navigator.clipboard && window.isSecureContext) {
            navigator.clipboard.writeText(text).then(markSuccess).catch(() => fallback());
          } else {
            fallback();
          }
          function fallback() {
            try {
              const ta = document.createElement('textarea');
              ta.value = text;
              ta.style.position = 'fixed';
              ta.style.left = '-9999px';
              ta.style.top = '-9999px';
              ta.setAttribute('readonly', '');
              document.body.appendChild(ta);
              ta.focus();
              ta.select();
              const ok = document.execCommand('copy');
              document.body.removeChild(ta);
              if (ok) markSuccess();
              else alert('Không thể tự động sao chép. Vui lòng chọn và sao chép thủ công!');
            } catch(e) {
              console.error('Fallback copy error:', e);
            }

            <!-- Toolbar Tabs & Copy -->
            <div style="display:flex; align-items:center; justify-content:space-between; padding:0.6rem 1.25rem; background:#182234; border-bottom:1px solid #233148; flex-shrink:0; flex-wrap:wrap; gap:0.5rem;">
              <div style="display:flex; align-items:center; gap:0.35rem; flex-wrap:wrap;" id="sub-tabs-container">
                <button type="button" class="sub-tab-btn" data-tab="bilingual" style="padding:0.35rem 0.75rem; border-radius:0.5rem; font-size:0.75rem; font-weight:700; background:#2563eb; color:#fff; border:1px solid #3b82f6; cursor:pointer;">🌐 Song ngữ 1:1</button>
                <button type="button" class="sub-tab-btn" data-tab="vietnamese" style="padding:0.35rem 0.75rem; border-radius:0.5rem; font-size:0.75rem; font-weight:600; background:#1e293b; color:#cbd5e1; border:1px solid #334155; cursor:pointer;">🇻🇳 Tiếng Việt</button>
                <button type="button" class="sub-tab-btn" data-tab="original" style="padding:0.35rem 0.75rem; border-radius:0.5rem; font-size:0.75rem; font-weight:600; background:#1e293b; color:#cbd5e1; border:1px solid #334155; cursor:pointer;">🇺🇸 Tiếng Gốc</button>
                ${summaryMd ? `<button type="button" class="sub-tab-btn" data-tab="summary" style="padding:0.35rem 0.75rem; border-radius:0.5rem; font-size:0.75rem; font-weight:600; background:#1e293b; color:#fcd34d; border:1px solid rgba(245,158,11,0.4); cursor:pointer;">🎙️ Kịch bản AI</button>` : ''}
              </div>
              <div style="display:flex; align-items:center; gap:0.35rem;">
                <button type="button" id="btn-copy-sub-active" style="padding:0.35rem 0.8rem; border-radius:0.5rem; font-size:0.75rem; font-weight:700; background:#10b981; color:#fff; border:1px solid #059669; cursor:pointer;">📋 Sao Chép Bản Này</button>
              </div>
            </div>

            <!-- Content Area -->
            <div id="sub-content-body" style="padding:1.25rem; overflow-y:auto; max-height:calc(92vh - 125px); font-size:0.85rem; line-height:1.6; color:#e2e8f0;">
            </div>
          </div>
        `;

        let currentTab = 'bilingual';
        const contentEl = document.getElementById('sub-content-body');
        const copyBtn = document.getElementById('btn-copy-sub-active');

        function renderTabContent(tab) {
          currentTab = tab;
          // Update tab buttons style
          modal.querySelectorAll('.sub-tab-btn').forEach(btn => {
            if (btn.getAttribute('data-tab') === tab) {
              btn.style.background = '#2563eb';
              btn.style.color = '#fff';
              btn.style.fontWeight = '700';
              btn.style.borderColor = '#3b82f6';
            } else {
              btn.style.background = '#1e293b';
              btn.style.color = btn.getAttribute('data-tab') === 'summary' ? '#fcd34d' : '#cbd5e1';
              btn.style.fontWeight = '600';
              btn.style.borderColor = '#334155';
            }
          });

          if (tab === 'bilingual') {
            if (!segments.length) {
              contentEl.innerHTML = `<div style="text-align:center; color:#94a3b8; padding:2rem;">Chưa có phân đoạn phụ đề song ngữ cho video này.</div>`;
              return;
            }
            contentEl.innerHTML = `
              <div style="display:flex; flex-direction:column; gap:0.6rem;">
                ${segments.map((seg) => `
                  <div style="display:flex; align-items:flex-start; gap:0.75rem; padding:0.65rem 0.85rem; background:#131d31; border:1px solid #1e293b; border-radius:0.625rem;">
                    <span style="font-family:monospace; font-size:0.72rem; color:#38bdf8; background:#0f172a; padding:0.15rem 0.45rem; border-radius:0.35rem; border:1px solid #1e293b; flex-shrink:0; font-weight:700;">[${formatSec(seg.start)}]</span>
                    <div style="flex:1; min-width:0;">
                      <div style="font-size:0.85rem; font-weight:600; color:#fff; line-height:1.4;">${esc(seg.text)}</div>
                      <div style="font-size:0.82rem; color:#fcd34d; margin-top:0.25rem; line-height:1.4;">${esc(seg.viText || '')}</div>
                    </div>
                  </div>
                `).join('')}
              </div>
            `;
          } else if (tab === 'vietnamese') {
            contentEl.innerHTML = `
              <div style="background:#131d31; border:1px solid #1e293b; border-radius:0.75rem; padding:1.25rem; white-space:pre-wrap; font-size:0.88rem; line-height:1.75; color:#fef3c7;">
                ${esc(fullVi || segments.map(s => s.viText).join('\n'))}
              </div>
            `;
          } else if (tab === 'original') {
            contentEl.innerHTML = `
              <div style="background:#131d31; border:1px solid #1e293b; border-radius:0.75rem; padding:1.25rem; white-space:pre-wrap; font-size:0.88rem; line-height:1.75; color:#e2e8f0; font-family:monospace;">
                ${esc(fullEn || segments.map(s => s.text).join('\n'))}
              </div>
            `;
          } else if (tab === 'summary') {
            contentEl.innerHTML = `
              <div class="max-w-none" style="background:#111827; border:1px solid #1f2937; border-radius:0.875rem; padding:1.5rem; color:#e2e8f0; font-size:0.85rem; line-height:1.65;">
                ${inlineMdFull(summaryMd)}
              </div>
            `;
          }
        }

        // Switch tab click
        modal.querySelectorAll('.sub-tab-btn').forEach(btn => {
          btn.onclick = () => {
            renderTabContent(btn.getAttribute('data-tab'));
          };
        });

        // Copy button action
        copyBtn.onclick = () => {
          let textToCopy = '';
          if (currentTab === 'bilingual') textToCopy = fullBilingual;
          else if (currentTab === 'vietnamese') textToCopy = fullVi;
          else if (currentTab === 'original') textToCopy = fullEn;
          else if (currentTab === 'summary') textToCopy = summaryMd;

          const copyDone = () => {
            copyBtn.textContent = '✅ Đã sao chép!';
            setTimeout(() => { copyBtn.textContent = '📋 Sao Chép Bản Này'; }, 2000);
          };
          const fallbackCopy = () => {
            const ta = document.createElement('textarea');
            ta.value = textToCopy;
            ta.setAttribute('readonly', '');
            ta.style.position = 'fixed';
            ta.style.left = '-9999px';
            document.body.appendChild(ta);
            ta.select();
            try { document.execCommand('copy'); } catch (err) {}
            document.body.removeChild(ta);
            copyDone();
          };
          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(textToCopy).then(copyDone).catch(fallbackCopy);
          } else {
            fallbackCopy();
          }
        };

        // Render initial tab
        renderTabContent('bilingual');
      };

      window.viewRawImage = function(src, title) {
        let modal = document.getElementById('raw-image-modal');
        if (!modal) {
          modal = document.createElement('div');
          modal.id = 'raw-image-modal';
          modal.style.cssText = 'display:none; position:fixed; top:0; left:0; right:0; bottom:0; z-index:99999; background:rgba(0,0,0,0.92); backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px); align-items:center; justify-content:center; padding:16px; box-sizing:border-box;';
          modal.onclick = (e) => {
            if (e.target === modal || e.target.id === 'close-raw-img' || (e.target.closest && e.target.closest('#close-raw-img'))) {
              modal.style.display = 'none';
              document.body.style.overflow = '';
            }
          };
          modal.innerHTML = `
            <div style="position:relative; width:100%; max-width:960px; max-height:92vh; background:#111827; border:1px solid #374151; border-radius:1rem; overflow:hidden; display:flex; flex-direction:column; box-shadow:0 25px 50px -12px rgba(0,0,0,0.85);">
              <div style="display:flex; align-items:center; justify-content:space-between; padding:0.75rem 1.25rem; background:#1f2937; border-bottom:1px solid #374151; flex-shrink:0;">
                <span id="raw-img-title" style="font-size:0.9rem; font-weight:700; color:#fff; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; display:flex; align-items:center; gap:0.5rem;"><span>📸</span><span></span></span>
                <button type="button" id="close-raw-img" class="btn-press cursor-pointer" style="padding:0.35rem 0.8rem; border-radius:0.5rem; background:#374151; border:1px solid #4b5563; color:#e5e7eb; font-size:0.8rem; font-weight:600;">✕ Đóng</button>
              </div>
              <div style="padding:0.75rem; overflow:auto; max-height:calc(92vh - 55px); display:flex; align-items:center; justify-content:center; background:#000;">
                <img id="raw-img-src" src="" alt="Ảnh kênh chi tiết" loading="lazy" decoding="async" style="max-width:100%; max-height:80vh; object-fit:contain; border-radius:0.5rem;">
              </div>
            </div>`;
          document.body.appendChild(modal);
        }
        document.querySelector('#raw-img-title span:last-child').textContent = title || 'Ảnh kênh gốc';
        document.getElementById('raw-img-src').src = src;
        modal.style.display = 'flex';
        document.body.style.overflow = 'hidden';
      };

      window.playEmbeddedDemoVideo = function(containerId, videoId) {
        const container = document.getElementById(containerId);
        if (!container) return;
        container.innerHTML = `<iframe src="https://www.youtube-nocookie.com/embed/${videoId}?autoplay=1&rel=0&modestbranding=1" style="width:100%; height:100%; border:none;" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>`;
      };

      window.openQuickVideoModal = function(videoId, videoTitle, channelName, badgeLabel) {
        let modal = document.getElementById('quick-video-modal');
        if (!modal) {
          modal = document.createElement('div');
          modal.id = 'quick-video-modal';
          modal.style.cssText = 'display:none; position:fixed; top:0; left:0; right:0; bottom:0; z-index:100001; background:rgba(0,0,0,0.92); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); align-items:center; justify-content:center; padding:16px; box-sizing:border-box;';
          
          const closeModal = () => {
            modal.style.display = 'none';
            modal.innerHTML = '';
            const otherOpen = document.getElementById('raw-deep-modal')?.style.display === 'flex' ||
                              document.getElementById('video-transcript-modal')?.style.display === 'flex' ||
                              document.getElementById('raw-image-modal')?.style.display === 'flex';
            if (!otherOpen) {
              document.body.style.overflow = '';
            }
          };
          window.closeQuickVideoModal = closeModal;

          modal.onclick = (e) => {
            if (e.target === modal || e.target.id === 'close-quick-video' || (e.target.closest && e.target.closest('#close-quick-video'))) {
              closeModal();
            }
          };
          document.body.appendChild(modal);
        }

        const badge = badgeLabel || '🔥 Tuyến Chuẩn';
        const displayChannel = channelName ? ('Kênh: ' + channelName) : 'Xem Trực Tiếp';

        modal.innerHTML = `
          <div style="position:relative; width:100%; max-width:960px; background:#0f172a; border:1px solid #334155; border-radius:1rem; overflow:hidden; display:flex; flex-direction:column; box-shadow:0 25px 50px -12px rgba(0,0,0,0.95);">
            <div style="display:flex; align-items:center; justify-content:space-between; padding:0.85rem 1.15rem; background:#1e293b; border-bottom:1px solid #334155; gap:1rem;">
              <div style="min-width:0;">
                <div style="display:flex; align-items:center; gap:0.45rem; flex-wrap:wrap;">
                  <span style="font-size:1.1rem;">🎬</span>
                  <h3 style="font-size:0.92rem; font-weight:700; color:#fff; margin:0;" class="truncate">${esc(displayChannel)}</h3>
                  <span style="font-size:0.68rem; font-weight:700; padding:0.1rem 0.45rem; border-radius:0.35rem; background:rgba(239,68,68,0.2); border:1px solid rgba(239,68,68,0.4); color:#fca5a5;">${esc(badge)}</span>
                </div>
                <p style="font-size:0.75rem; color:#94a3b8; margin:0.2rem 0 0 0;" class="truncate" title="${esc(videoTitle)}">${esc(videoTitle)}</p>
              </div>
              <div style="display:flex; align-items:center; gap:0.5rem; flex-shrink:0;">
                <a href="https://www.youtube.com/watch?v=${videoId}" target="_blank" rel="noopener noreferrer" style="font-size:0.75rem; padding:0.35rem 0.75rem; border-radius:0.5rem; background:#2563eb; color:#fff; text-decoration:none; font-weight:600;">↗ Mở YouTube</a>
                <button type="button" id="close-quick-video" style="padding:0.35rem 0.75rem; border-radius:0.5rem; background:#334155; border:1px solid #475569; color:#e2e8f0; font-size:0.75rem; font-weight:600; cursor:pointer;" title="Đóng [Esc]">✕ Đóng</button>
              </div>
            </div>
            <div style="width:100%; aspect-ratio:16/9; background:#000;">
              <iframe src="https://www.youtube-nocookie.com/embed/${videoId}?autoplay=1&rel=0&modestbranding=1" style="width:100%; height:100%; border:none;" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>
            </div>
          </div>
        `;
        modal.style.display = 'flex';
        document.body.style.overflow = 'hidden';
      };

      // Delegated safe handlers: truyen du lieu qua data-* thay vi inline onclick.
      // Ly do: tieu de video co dau nhay don (vi du "Can't", "Earth's") lam vo lenh
      // JS khi dung inline onclick -> nut "Xem Video" chet hoan toan.
      document.addEventListener('click', (e) => {
        const t = e.target;
        if (!t || !t.closest) return;
        const quick = t.closest('.js-quick-video');
        if (quick) {
          e.stopPropagation();
          e.preventDefault();
          const vid = quick.getAttribute('data-vid');
          if (vid) {
            window.openQuickVideoModal(
              vid,
              quick.getAttribute('data-title') || '',
              quick.getAttribute('data-channel') || '',
              quick.getAttribute('data-badge') || '▶ Video'
            );
          }
          return;
        }
        const img = t.closest('.js-view-raw-image');
        if (img) {
          if (window.viewRawImage) window.viewRawImage(img.getAttribute('data-src') || '', img.getAttribute('data-title') || '');
          return;
        }
        const demo = t.closest('.js-play-demo');
        if (demo) {
          e.stopPropagation();
          e.preventDefault();
          if (window.playEmbeddedDemoVideo) window.playEmbeddedDemoVideo(demo.getAttribute('data-container') || '', demo.getAttribute('data-vid') || '');
        }
      }, true);

      // Global Shortcuts: Escape to close modals, / to focus search
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
          const musicModal = document.getElementById('music-studio-modal');
          if (musicModal && musicModal.style.display === 'flex') {
            const closeM = document.getElementById('close-music-studio');
            if (closeM) closeM.click();
            else { musicModal.style.display = 'none'; document.body.style.overflow = ''; }
            return;
          }
          const quickModal = document.getElementById('quick-video-modal');
          if (quickModal && quickModal.style.display === 'flex') {
            if (window.closeQuickVideoModal) window.closeQuickVideoModal();
            else { quickModal.style.display = 'none'; quickModal.innerHTML = ''; }
            return;
          }
          const subModal = document.getElementById('video-transcript-modal');
          if (subModal && subModal.style.display === 'flex') {
            subModal.style.display = 'none';
            return;
          }
          const rawModal = document.getElementById('raw-deep-modal') || document.getElementById('raw-detail-modal');
          if (rawModal && rawModal.style.display === 'flex') {
            rawModal.style.display = 'none';
            document.body.style.overflow = '';
            return;
          }
          const imgModal = document.getElementById('raw-image-modal');
          if (imgModal && imgModal.style.display === 'flex') {
            imgModal.style.display = 'none';
            document.body.style.overflow = '';
            return;
          }
        } else if (e.key === '/' && !e.ctrlKey && !e.metaKey && !e.altKey) {
          const activeTag = document.activeElement ? document.activeElement.tagName.toUpperCase() : '';
          if (activeTag !== 'INPUT' && activeTag !== 'TEXTAREA') {
            const fq = document.getElementById('fq');
            if (fq) {
              e.preventDefault();
              fq.focus();
              fq.select();
            }
          }
        }
      });
    })();
  </script>
  <script src="assets/music_player_modal.js?v=20260921-mobile-v1"></script>
