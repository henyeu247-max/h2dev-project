    function xanhBadge(x) {
      if (x === true) return ['badge-green', 'XANH'];

    function openTab(id, extra, pushHistory = true) {
      state.tab = id || 'tongquan';
      // Nếu mở tab Video mà không kèm danh sách SKU cụ thể, xóa sạch mọi bộ lọc ẩn
      // còn sót từ tab trước (ví dụ skuFilter từ Ngách xanh) để không rơi vào trạng thái 0/tổng.
      if (state.tab === 'video' && !(extra && extra.skuFilter)) {
        state.skuFilter = '';
        state.nicheFilter = '';
        state.marketFilter = '';
        state.q = '';
        state.freeOnly = false;
        state.watchFilter = '';
      }
      if (extra) Object.assign(state, extra);
      if (pushHistory) {
        try {
          const cleanPath = (state.tab === 'tongquan') ? '/' : ('/' + state.tab);
          const url = new URL(cleanPath, location.origin);
          if (state.marketFilter) url.searchParams.set('market', state.marketFilter);
          if (state.nicheFilter) url.searchParams.set('niche', state.nicheFilter);
          history.pushState({ tab: state.tab, market: state.marketFilter, niche: state.nicheFilter }, '', url.pathname + url.search);
        } catch (e) {}
      }
      renderTabs();
      render();
    }
    function openNicheVideos(key, skus) {
      openTab('video', { nicheFilter: key || '', skuFilter: skus || '', q: '', marketFilter: '', freeOnly: false });
    }
    function expandNicheMore(btn) {
      const wrap = btn.closest('[data-niche-list]');
      if (!wrap) return;
      wrap.querySelectorAll('[data-more]').forEach(el => el.classList.remove('hidden'));
      btn.remove();
    }
    function bindNicheActions() {
      document.querySelectorAll('[data-open-niche]').forEach(btn => {
        btn.addEventListener('click', e => {
          if (btn.hasAttribute('data-open-tab')) return;
          e.preventDefault();
          openNicheVideos(btn.getAttribute('data-open-niche'), btn.getAttribute('data-skus') || '');
        });
      });
      document.querySelectorAll('[data-expand-niche]').forEach(btn => {
        btn.addEventListener('click', e => { e.preventDefault(); expandNicheMore(btn); });
      });
      document.querySelectorAll('[data-open-tab]').forEach(btn => {
        btn.addEventListener('click', e => {
          e.preventDefault();
          const tab = btn.getAttribute('data-open-tab');
          const extra = {};
          if (tab === 'kichban') { extra.kindFilter = btn.getAttribute('data-kind') || ''; extra.promptNiche = btn.getAttribute('data-prompt-niche') || ''; extra.promptQ = ''; }
          if (tab === 'video') { extra.nicheFilter = btn.getAttribute('data-open-niche') || ''; extra.skuFilter = btn.getAttribute('data-skus') || ''; extra.marketFilter = btn.getAttribute('data-market-filter') || ''; extra.q = ''; extra.freeOnly = btn.getAttribute('data-free-only') === 'true'; }
          if (tab === 'kenh') { extra.kenhNiche = btn.getAttribute('data-kenh-niche') || ''; extra.kenhQ = ''; }
          openTab(tab, extra);
        });
      });
    }


    function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
    function fmtBytes(n) { if (!n) return ''; if (n > 1e9) return (n / 1e9).toFixed(2) + ' GB'; if (n > 1e6) return (n / 1e6).toFixed(0) + ' MB'; return (n / 1e3).toFixed(0) + ' KB'; }
    function fmtMb(mb) { if (!mb) return ''; return mb >= 1024 ? (mb / 1024).toFixed(1) + ' GB' : mb.toFixed(0) + ' MB'; }
    function loadChecks() { try { return JSON.parse(localStorage.getItem('h2dev-checklist') || '{}'); } catch (e) { return {}; } }
    function saveCheck(id, on) { const m = loadChecks(); m[id] = !!on; localStorage.setItem('h2dev-checklist', JSON.stringify(m)); }
    /* Shared watched/progress store (same key + schema as player.html) */
    function loadWatched() { try { return JSON.parse(localStorage.getItem('h2dev-watched') || '{}'); } catch (e) { return {}; } }
    async function hydrateAdminState() {
      try {
        const r = await fetch('/api/admin-state', { cache: 'no-store' });
        if (!r.ok) return;
        const s = await r.json();
        const curW = loadWatched();
        const remoteW = (s.watched && typeof s.watched === 'object') ? s.watched : {};
        const mergedW = Object.assign({}, remoteW);
        for (const k in curW) {
          if (!mergedW[k]) {
            mergedW[k] = curW[k];
          } else {
            mergedW[k] = {
              watched: Boolean(curW[k].watched || mergedW[k].watched),
              t: Math.max(curW[k].t || 0, mergedW[k].t || 0),
              d: Math.max(curW[k].d || 0, mergedW[k].d || 0),
              note: curW[k].note || mergedW[k].note || ''
            };
          }
        }
        localStorage.setItem('h2dev-watched', JSON.stringify(mergedW));

        const curF = JSON.parse(localStorage.getItem('h2dev-fav') || '[]');
        const remoteF = Array.isArray(s.favorites) ? s.favorites : [];
        const favSet = new Set([...remoteF, ...(Array.isArray(curF) ? curF : [])].filter(Boolean));
        localStorage.setItem('h2dev-fav', JSON.stringify([...favSet]));

        if (s.recent && !localStorage.getItem('h2dev-recent')) {
          localStorage.setItem('h2dev-recent', JSON.stringify(s.recent));
        }
        localStorage.setItem('h2dev-admin', JSON.stringify(Object.assign({}, s, { watched: mergedW, favorites: [...favSet] })));
      } catch (e) {}
    }
    function watchedBadge(sku) {
      const w = loadWatched()[sku];
      if (!w) return '';
      const d = Number(w.d) || 0, t = Number(w.t) || 0;
      const ratio = (d > 0 && t > 0) ? Math.min(1, t / d) : 0;
      const done = Boolean(w.watched) || ratio >= 0.95;
      if (done) return `<span class="badge badge-green" title="Đã xem hết">✓ Đã xem</span>`;
      if (ratio > 0.02) return `<span class="badge badge-amber" title="Đang xem dở ${Math.round(ratio * 100)}% — Xem tiếp">Dở ${Math.round(ratio * 100)}%</span>`;
      return '';
    }
    function watchedProgress(sku) {
      const w = loadWatched()[sku];
      if (!w) return '';
      const d = Number(w.d) || 0, t = Number(w.t) || 0;
      const ratio = (d > 0 && t > 0) ? Math.min(100, Math.round(t / d * 100)) : 0;
      if (ratio <= 0) return '';
      return `<div class="absolute bottom-0 left-0 right-0 h-1 bg-ink-900/80"><div class="h-full bg-brand-500" style="width:${ratio}%"></div></div>`;
    }
    function watchedResumeLabel(sku) {
      const w = loadWatched()[sku];
      if (!w) return '';
      const d = Number(w.d) || 0, t = Number(w.t) || 0;
      const ratio = (d > 0 && t > 0) ? Math.min(1, t / d) : 0;
      if (w.watched || ratio >= 0.95) return '';
      if (ratio > 0.02) { const m = Math.floor(t / 60), s = Math.floor(t % 60); return `Xem tiếp (${m}:${String(s).padStart(2, '0')})`; }
      return '';
    }

        if (e.key === 'ArrowRight' || e.key === 'ArrowDown' || e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
          e.preventDefault();
          const tabs = [...document.querySelectorAll('#tabs .tab-btn')];
          const index = tabs.indexOf(b);
          if (index < 0) return;
          const next = (index + (e.key === 'ArrowRight' || e.key === 'ArrowDown' ? 1 : -1) + tabs.length) % tabs.length;
          tabs[next].focus(); tabs[next].click();

        const isOverflowActive = overflowTabs.some(t => t.id === state.tab);

      let sheet = document.getElementById('moreMenuSheet');

        return;
      }
      backdrop = document.createElement('div');
      backdrop.id = 'moreMenuBackdrop';

      function vidsFor(n) {
        const bySku = new Map(videos.map(v => [String(v.sku || '').toLowerCase(), v]));
        const out = [];
        const seen = new Set();
        function add(v) {
          if (!v || seen.has(v.sku)) return;
          seen.add(v.sku);
          out.push(v);
        }
        for (const ref of (n && n.skus) || []) {
          const sku = typeof ref === 'string' ? ref : (ref && ref.sku);
          add(bySku.get(String(sku || '').toLowerCase()));
        }
        const handles = new Set(((n && n.mauSach) || []).map(h => String(h).toLowerCase()));
        if (handles.size) {
          for (const v of videos) {
            if ((v.channels || []).some(c => handles.has(String(c).toLowerCase()))) add(v);
          }
        }
        return out;
      }

        return match ? '$' + match[1] : 'Chưa đo';

      function nxCompShort(field) {
        const raw = String(field || '').trim();

              </div>
              <div style="display:flex; align-items:center; gap:0.5rem; flex-shrink:0;">
                <button type="button" onclick="window.openQuickVideoModal('${esc(videoId)}', '${esc(videoTitle)}', '${esc(channelName)}', '🔥 Đang xem Transcript')" style="padding:0.4rem 0.8rem; border-radius:0.5rem; background:rgba(225,29,72,0.9); border:1px solid #f43f5e; color:#fff; font-size:0.75rem; font-weight:700; cursor:pointer; display:inline-flex; align-items:center; gap:0.35rem;" title="Mở video xem trực tiếp đồng bộ với phụ đề">🎬 Xem Video Nhanh</button>
                <a href="https://www.youtube.com/watch?v=${esc(videoId)}" target="_blank" rel="noopener noreferrer" style="padding:0.4rem 0.8rem; border-radius:0.5rem; background:#1e293b; border:1px solid #334155; color:#38bdf8; font-size:0.75rem; font-weight:600; text-decoration:none; display:inline-flex; align-items:center; gap:0.35rem;">📺 YouTube ↗</a>
                <button type="button" id="close-video-sub" style="padding:0.4rem 0.8rem; border-radius:0.5rem; background:#374151; border:1px solid #4b5563; color:#e5e7eb; font-size:0.75rem; font-weight:600; cursor:pointer;">✕ Đóng</button>
              </div>
            </div>

            <!-- Toolbar Tabs & Copy -->
            <div style="display:flex; align-items:center; justify-content:space-between; padding:0.6rem 1.25rem; background:#182234; border-bottom:1px solid #233148; flex-shrink:0; flex-wrap:wrap; gap:0.5rem;">
              <div style="display:flex; align-items:center; gap:0.35rem; flex-wrap:wrap;" id="sub-tabs-container">
                <button type="button" class="sub-tab-btn" data-tab="bilingual" style="padding:0.35rem 0.75rem; border-radius:0.5rem; font-size:0.75rem; font-weight:700; background:#2563eb; color:#fff; border:1px solid #3b82f6; cursor:pointer;">🌐 Song Ngữ 1:1</button>
                <button type="button" class="sub-tab-btn" data-tab="vietnamese" style="padding:0.35rem 0.75rem; border-radius:0.5rem; font-size:0.75rem; font-weight:600; background:#1e293b; color:#cbd5e1; border:1px solid #334155; cursor:pointer;">🇻🇳 Chỉ Tiếng Việt</button>
                <button type="button" class="sub-tab-btn" data-tab="original" style="padding:0.35rem 0.75rem; border-radius:0.5rem; font-size:0.75rem; font-weight:600; background:#1e293b; color:#cbd5e1; border:1px solid #334155; cursor:pointer;">🇺🇸 Chỉ Tiếng Gốc</button>
                ${summaryMd ? `<button type="button" class="sub-tab-btn" data-tab="summary" style="padding:0.35rem 0.75rem; border-radius:0.5rem; font-size:0.75rem; font-weight:600; background:#1e293b; color:#fcd34d; border:1px solid rgba(245,158,11,0.4); cursor:pointer;">🎙️ Kịch Bản & Voice AI</button>` : ''}
              </div>
              <div style="display:flex; align-items:center; gap:0.35rem;">
                <button type="button" id="btn-copy-sub-active" style="padding:0.35rem 0.8rem; border-radius:0.5rem; font-size:0.75rem; font-weight:700; background:#10b981; color:#fff; border:1px solid #059669; cursor:pointer;">📋 Sao Chép Bản Này</button>
              </div>
            </div>

            <!-- Content Area -->
            <div id="sub-content-body" style="padding:1.25rem; overflow-y:auto; max-height:calc(92vh - 125px); font-size:0.85rem; line-height:1.6; color:#e2e8f0;">
            </div>
          </div>
        `;

        let currentTab = 'bilingual';
        const contentEl = document.getElementById('sub-content-body');
        const copyBtn = document.getElementById('btn-copy-sub-active');

        function renderTabContent(tab) {
          currentTab = tab;
          // Update tab buttons style
          modal.querySelectorAll('.sub-tab-btn').forEach(btn => {
            if (btn.getAttribute('data-tab') === tab) {
              btn.style.background = '#2563eb';
              btn.style.color = '#fff';
              btn.style.fontWeight = '700';
              btn.style.borderColor = '#3b82f6';
            } else {
              btn.style.background = '#1e293b';
              btn.style.color = btn.getAttribute('data-tab') === 'summary' ? '#fcd34d' : '#cbd5e1';
              btn.style.fontWeight = '600';
              btn.style.borderColor = '#334155';
            }
          });

          if (tab === 'bilingual') {
            if (!segments.length) {
              contentEl.innerHTML = `<div style="text-align:center; color:#94a3b8; padding:2rem;">Chưa có phân đoạn phụ đề song ngữ cho video này.</div>`;
              return;
            }
            contentEl.innerHTML = `
              <div style="display:flex; flex-direction:column; gap:0.6rem;">
                ${segments.map((seg) => `
                  <div style="display:flex; align-items:flex-start; gap:0.75rem; padding:0.65rem 0.85rem; background:#131d31; border:1px solid #1e293b; border-radius:0.625rem;">
                    <span style="font-family:monospace; font-size:0.72rem; color:#38bdf8; background:#0f172a; padding:0.15rem 0.45rem; border-radius:0.35rem; border:1px solid #1e293b; flex-shrink:0; font-weight:700;">[${formatSec(seg.start)}]</span>
                    <div style="flex:1; min-width:0;">
                      <div style="font-size:0.85rem; font-weight:600; color:#fff; line-height:1.4;">${esc(seg.text)}</div>
                      <div style="font-size:0.82rem; color:#fcd34d; margin-top:0.25rem; line-height:1.4;">${esc(seg.viText || '')}</div>
                    </div>
                  </div>
                `).join('')}
              </div>
            `;
          } else if (tab === 'vietnamese') {
            contentEl.innerHTML = `
              <div style="background:#131d31; border:1px solid #1e293b; border-radius:0.75rem; padding:1.25rem; white-space:pre-wrap; font-size:0.88rem; line-height:1.75; color:#fef3c7;">
                ${esc(fullVi || segments.map(s => s.viText).join('\n'))}
              </div>
            `;
          } else if (tab === 'original') {
            contentEl.innerHTML = `
              <div style="background:#131d31; border:1px solid #1e293b; border-radius:0.75rem; padding:1.25rem; white-space:pre-wrap; font-size:0.88rem; line-height:1.75; color:#e2e8f0; font-family:monospace;">
                ${esc(fullEn || segments.map(s => s.text).join('\n'))}
              </div>
            `;
          } else if (tab === 'summary') {
            contentEl.innerHTML = `
              <div class="prose prose-invert max-w-none" style="background:#111827; border:1px solid #1f2937; border-radius:0.875rem; padding:1.5rem; color:#e2e8f0; font-size:0.85rem; line-height:1.65;">
                ${inlineMdFull(summaryMd)}
              </div>
            `;
          }
        }

        // Switch tab click
        modal.querySelectorAll('.sub-tab-btn').forEach(btn => {
          btn.onclick = () => {
            renderTabContent(btn.getAttribute('data-tab'));
          };
        });

        // Copy button action
        copyBtn.onclick = () => {
          let textToCopy = '';
          if (currentTab === 'bilingual') textToCopy = fullBilingual;
          else if (currentTab === 'vietnamese') textToCopy = fullVi;
          else if (currentTab === 'original') textToCopy = fullEn;
          else if (currentTab === 'summary') textToCopy = summaryMd;

          navigator.clipboard.writeText(textToCopy).then(() => {
            copyBtn.textContent = '✅ Đã sao chép!';
            setTimeout(() => { copyBtn.textContent = '📋 Sao Chép Bản Này'; }, 2000);
          }).catch(() => {
            alert('Đã sao chép nội dung vào bộ nhớ tạm!');
          });
        };

        // Render initial tab
        renderTabContent('bilingual');
      };

      window.viewRawImage = function(src, title) {
        let modal = document.getElementById('raw-image-modal');
        if (!modal) {
          modal = document.createElement('div');
          modal.id = 'raw-image-modal';
          modal.style.cssText = 'display:none; position:fixed; top:0; left:0; right:0; bottom:0; z-index:99999; background:rgba(0,0,0,0.92); backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px); align-items:center; justify-content:center; padding:16px; box-sizing:border-box;';
          modal.onclick = (e) => {
            if (e.target === modal || e.target.id === 'close-raw-img' || (e.target.closest && e.target.closest('#close-raw-img'))) {
              modal.style.display = 'none';
              document.body.style.overflow = '';
            }
          };
          modal.innerHTML = `
            <div style="position:relative; width:100%; max-width:960px; max-height:92vh; background:#111827; border:1px solid #374151; border-radius:1rem; overflow:hidden; display:flex; flex-direction:column; box-shadow:0 25px 50px -12px rgba(0,0,0,0.85);">
              <div style="display:flex; align-items:center; justify-content:space-between; padding:0.75rem 1.25rem; background:#1f2937; border-bottom:1px solid #374151; flex-shrink:0;">
                <span id="raw-img-title" style="font-size:0.9rem; font-weight:700; color:#fff; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; display:flex; align-items:center; gap:0.5rem;"><span>📸</span><span></span></span>
                <button type="button" id="close-raw-img" class="btn-press cursor-pointer" style="padding:0.35rem 0.8rem; border-radius:0.5rem; background:#374151; border:1px solid #4b5563; color:#e5e7eb; font-size:0.8rem; font-weight:600;">✕ Đóng</button>
              </div>
              <div style="padding:0.75rem; overflow:auto; max-height:calc(92vh - 55px); display:flex; align-items:center; justify-content:center; background:#000;">
                <img id="raw-img-src" src="" alt="Ảnh kênh chi tiết" style="max-width:100%; max-height:80vh; object-fit:contain; border-radius:0.5rem;">
              </div>
            </div>`;
          document.body.appendChild(modal);
        }
        document.querySelector('#raw-img-title span:last-child').textContent = title || 'Ảnh kênh gốc';
        document.getElementById('raw-img-src').src = src;
        modal.style.display = 'flex';
        document.body.style.overflow = 'hidden';
      };

      window.playEmbeddedDemoVideo = function(containerId, videoId) {
        const container = document.getElementById(containerId);
        if (!container) return;
        container.innerHTML = `<iframe src="https://www.youtube-nocookie.com/embed/${videoId}?autoplay=1&rel=0&modestbranding=1" style="width:100%; height:100%; border:none;" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>`;
      };

      window.openQuickVideoModal = function(videoId, videoTitle, channelName, badgeLabel) {
        let modal = document.getElementById('quick-video-modal');
        if (!modal) {
          modal = document.createElement('div');
          modal.id = 'quick-video-modal';
          modal.style.cssText = 'display:none; position:fixed; top:0; left:0; right:0; bottom:0; z-index:100001; background:rgba(0,0,0,0.92); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); align-items:center; justify-content:center; padding:16px; box-sizing:border-box;';
          
          const closeModal = () => {
            modal.style.display = 'none';
            modal.innerHTML = '';
            const otherOpen = document.getElementById('raw-deep-modal')?.style.display === 'flex' ||
                              document.getElementById('video-transcript-modal')?.style.display === 'flex' ||
                              document.getElementById('raw-image-modal')?.style.display === 'flex';
            if (!otherOpen) {
              document.body.style.overflow = '';
            }
          };
          window.closeQuickVideoModal = closeModal;

          modal.onclick = (e) => {
            if (e.target === modal || e.target.id === 'close-quick-video' || (e.target.closest && e.target.closest('#close-quick-video'))) {
              closeModal();
            }
          };
          document.body.appendChild(modal);
        }

        const badge = badgeLabel || '🔥 Tuyến Chuẩn';
        const displayChannel = channelName ? ('Kênh: ' + channelName) : 'Xem Trực Tiếp';

        modal.innerHTML = `
          <div style="position:relative; width:100%; max-width:960px; background:#0f172a; border:1px solid #334155; border-radius:1rem; overflow:hidden; display:flex; flex-direction:column; box-shadow:0 25px 50px -12px rgba(0,0,0,0.95);">
            <div style="display:flex; align-items:center; justify-content:space-between; padding:0.85rem 1.15rem; background:#1e293b; border-bottom:1px solid #334155; gap:1rem;">
              <div style="min-width:0;">
                <div style="display:flex; align-items:center; gap:0.45rem; flex-wrap:wrap;">
                  <span style="font-size:1.1rem;">🎬</span>
                  <h3 style="font-size:0.92rem; font-weight:700; color:#fff; margin:0;" class="truncate">${esc(displayChannel)}</h3>
                  <span style="font-size:0.68rem; font-weight:700; padding:0.1rem 0.45rem; border-radius:0.35rem; background:rgba(239,68,68,0.2); border:1px solid rgba(239,68,68,0.4); color:#fca5a5;">${esc(badge)}</span>
                </div>
                <p style="font-size:0.75rem; color:#94a3b8; margin:0.2rem 0 0 0;" class="truncate" title="${esc(videoTitle)}">${esc(videoTitle)}</p>
              </div>
              <div style="display:flex; align-items:center; gap:0.5rem; flex-shrink:0;">
                <a href="https://www.youtube.com/watch?v=${videoId}" target="_blank" rel="noopener noreferrer" style="font-size:0.75rem; padding:0.35rem 0.75rem; border-radius:0.5rem; background:#2563eb; color:#fff; text-decoration:none; font-weight:600;">↗ Mở YouTube</a>
                <button type="button" id="close-quick-video" style="padding:0.35rem 0.75rem; border-radius:0.5rem; background:#334155; border:1px solid #475569; color:#e2e8f0; font-size:0.75rem; font-weight:600; cursor:pointer;" title="Đóng [Esc]">✕ Đóng</button>
              </div>
            </div>
            <div style="width:100%; aspect-ratio:16/9; background:#000;">
              <iframe src="https://www.youtube-nocookie.com/embed/${videoId}?autoplay=1&rel=0&modestbranding=1" style="width:100%; height:100%; border:none;" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>
            </div>
          </div>
        `;
        modal.style.display = 'flex';
        document.body.style.overflow = 'hidden';
      };

      // Global Escape Key to close top-most active modal
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
          const quickModal = document.getElementById('quick-video-modal');
          if (quickModal && quickModal.style.display === 'flex') {
            if (window.closeQuickVideoModal) window.closeQuickVideoModal();
            else { quickModal.style.display = 'none'; quickModal.innerHTML = ''; }
            return;
          }
          const subModal = document.getElementById('video-transcript-modal');
          if (subModal && subModal.style.display === 'flex') {
            subModal.style.display = 'none';
            return;
          }
          const rawModal = document.getElementById('raw-deep-modal') || document.getElementById('raw-detail-modal');
          if (rawModal && rawModal.style.display === 'flex') {
            rawModal.style.display = 'none';
            document.body.style.overflow = '';
            return;
          }
          const imgModal = document.getElementById('raw-image-modal');
          if (imgModal && imgModal.style.display === 'flex') {
            imgModal.style.display = 'none';
            document.body.style.overflow = '';
            return;
          }
        }
      });
    })();
  </script>
</body>

</html>
