  <style>
    #raw-channel-modal {
      position: fixed !important;
      top: 0 !important;
      left: 0 !important;
      right: 0 !important;
      bottom: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      z-index: 99999 !important;
      background-color: rgba(0, 0, 0, 0.85) !important;
      backdrop-filter: blur(12px) !important;
      -webkit-backdrop-filter: blur(12px) !important;
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
      padding: 16px !important;
      box-sizing: border-box !important;
    }
    #raw-channel-modal > div {
      max-height: 90vh !important;
      height: 90vh !important;
      display: flex !important;
      flex-direction: column !important;
      overflow: hidden !important;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.75) !important;
    }
    #raw-channel-modal.hidden {
      display: none !important;
    }
    .modal-video-thumb {
      width: 210px !important;
      min-width: 210px !important;
      max-width: 210px !important;
      height: 118px !important;
      aspect-ratio: 16 / 9 !important;
      flex-shrink: 0 !important;
    }
    .music-studio-grid {
      display: grid;
    }
    .raw-deep-mobile-hide {
      display: inline;
    }
    @media (max-width: 640px) {
      .raw-deep-mobile-hide {
        display: none !important;
      }
      /* Bottom-sheet modal presentation on mobile phones */
      #raw-deep-modal,
      #raw-channel-modal,
      #music-studio-modal,
      #video-transcript-modal,
      #raw-image-modal {
        padding: 0 !important;
        align-items: flex-end !important;
      }
      #raw-deep-modal > div,
      #raw-channel-modal > div,
      #music-studio-modal > div,
      #video-transcript-modal > div {
        max-height: 95vh !important;
        height: 95vh !important;
        width: 100% !important;
        max-width: 100% !important;
        border-bottom-left-radius: 0 !important;
        border-bottom-right-radius: 0 !important;
        border-top-left-radius: 1.25rem !important;
        border-top-right-radius: 1.25rem !important;
        margin: 0 !important;
      }

      /* Compact mobile header for raw deep modal */
      .raw-deep-header {
        padding: 0.75rem 0.85rem !important;
        gap: 0.45rem !important;
        display: flex !important;
        flex-direction: column !important;
        align-items: stretch !important;
      }
      .raw-deep-header-row1 {
        display: flex !important;
        align-items: center !important;
        justify-content: space-between !important;
        width: 100% !important;
        gap: 0.5rem !important;
      }
      .raw-deep-header-avatar-info {
        display: flex !important;
        align-items: center !important;
        gap: 0.5rem !important;
        min-width: 0 !important;
        flex: 1 !important;
      }
      .raw-deep-header-avatar {
        width: 38px !important;
        height: 38px !important;
        border-radius: 0.5rem !important;
      }
      .raw-deep-header-title {
        font-size: 0.92rem !important;
        max-width: 170px !important;
      }
      .raw-deep-header-meta {
        display: flex !important;
        align-items: center !important;
        gap: 0.35rem !important;
        font-size: 0.7rem !important;
        overflow-x: auto !important;
        white-space: nowrap !important;
        -webkit-overflow-scrolling: touch !important;
        scrollbar-width: none !important;
        padding-bottom: 2px !important;
      }
      .raw-deep-header-meta::-webkit-scrollbar {
        display: none !important;
      }
      .raw-deep-header-actions {
        display: flex !important;
        align-items: center !important;
        gap: 0.35rem !important;
        flex-shrink: 0 !important;
      }
      .raw-deep-header-actions a,
      .raw-deep-header-actions button {
        padding: 0.35rem 0.65rem !important;
        font-size: 0.75rem !important;
        border-radius: 0.5rem !important;
      }

      /* Body padding on mobile */
      .raw-deep-body {
        padding: 0.75rem 0.85rem !important;
        gap: 0.85rem !important;
        max-height: calc(95vh - 85px) !important;
      }

      /* Quick Jump Bar - horizontal swipeable pills */
      .raw-deep-quicknav {
        overflow-x: auto !important;
        flex-wrap: nowrap !important;
        white-space: nowrap !important;
        padding: 0.45rem 0.65rem !important;
        gap: 0.35rem !important;
        -webkit-overflow-scrolling: touch !important;
        scrollbar-width: none !important;
      }
      .raw-deep-quicknav::-webkit-scrollbar {
        display: none !important;
      }
      .raw-deep-quicknav button {
        flex-shrink: 0 !important;
        font-size: 0.7rem !important;
        padding: 0.25rem 0.55rem !important;
      }

      /* 4 KPI Cards: neat 2x2 grid on phone */
      .raw-deep-kpis {
        grid-template-columns: repeat(2, 1fr) !important;
        gap: 0.5rem !important;
      }
      .raw-deep-kpi-card {
        padding: 0.65rem 0.75rem !important;
      }
      .raw-deep-kpi-card .kpi-val {
        font-size: 1.15rem !important;
      }

      /* Retention proxy mobile fix */
      .raw-proxy-grid {
        grid-template-columns: 1fr !important;
        gap: 0.6rem !important;
      }
      .raw-proxy-subgrid {
        grid-template-columns: 1fr !important;
        gap: 0.45rem !important;
      }

      /* Mission Control Bento Grid */
      .raw-mission-bento {
        grid-template-columns: 1fr !important;
        gap: 0.75rem !important;
      }

      /* Top Videos Grid */
      .raw-top-videos-grid {
        grid-template-columns: 1fr !important;
        gap: 0.75rem !important;
      }

      /* Music studio grid mobile */
      .music-studio-grid {
        grid-template-columns: 1fr !important;
        padding: 0.75rem !important;
        gap: 0.75rem !important;
      }

      .modal-video-thumb {
        width: 100% !important;
        min-width: 100% !important;
        max-width: 100% !important;
        height: auto !important;
        aspect-ratio: 16 / 9 !important;
      }
    }
  </style>
