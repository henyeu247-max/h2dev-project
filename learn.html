<!DOCTYPE html>
<html lang="vi" data-theme="dark" data-density="compact" style="color-scheme: dark;">
<head>
  <meta charset="UTF-8">
  <base href="/" target="_top">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="H2DEV Project — Lộ trình học YouTube faceless theo Module, không cần đăng nhập.">
  <meta name="theme-color" content="#050505">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><circle cx='32' cy='32' r='27' fill='none' stroke='%23E2023A' stroke-width='2.5'/><circle cx='32' cy='32' r='3' fill='%23E2023A'/></svg>">
  <title>H2DEV — Lộ trình</title>
  <link rel="stylesheet" href="/assets/viddar.css?v=20260924-p40">
  <link rel="stylesheet" href="/assets/learn.css?v=20260924-p40">
<link rel="stylesheet" href="/assets/h2dev-tokens.css?v=20260924-p40">
<link rel="stylesheet" href="/assets/h2dev-primitives.css?v=20260924-p40">
<link rel="stylesheet" href="/assets/h2dev-components-lesson-row.css?v=20260924-p40">
<link rel="stylesheet" href="/assets/h2dev-icons.css?v=20260924-p40">
  <link rel="stylesheet" href="/assets/h2dev-shell.css?v=20260924-p40">
</head>
<body>
  <!-- PHASE 2: Skip-link chuan (truoc day learn THIEU) -->
  <a href="#panelRoot" class="h2-shell-skip">Bỏ qua điều hướng</a>
  <header class="learn-header h2-shell-header">
    <div class="learn-brand">
      <a href="/" class="h2-shell-brand" target="_top" title="Về trang chủ H2DEV">
        <span class="vd-radar-wrap">
          <svg class="vd-radar" width="28" height="28" viewBox="0 0 64 64" fill="none" role="img" aria-label="H2DEV">
            <defs>
              <linearGradient id="vd-sweep-learn" x1="32" y1="32" x2="53" y2="12" gradientUnits="userSpaceOnUse">
                <stop stop-color="#E2023A" stop-opacity=".95"/>
                <stop offset="1" stop-color="#E2023A" stop-opacity="0"/>
              </linearGradient>
            </defs>
            <rect width="64" height="64" rx="4" fill="#050505"></rect>
            <circle class="radar-ping" cx="32" cy="32" r="21" stroke="#E2023A" stroke-width="2.4" opacity=".55"></circle>
            <g class="radar-sweep">
              <path d="M32 32 L32 11 A21 21 0 0 1 51.7 25.8 Z" fill="url(#vd-sweep-learn)"></path>
              <line x1="32" y1="32" x2="51.7" y2="25.8" stroke="#E2023A" stroke-width="2.4" stroke-linecap="round"></line>
            </g>
            <circle cx="32" cy="32" r="2.8" fill="#E2023A"></circle>
            <circle cx="44" cy="21" r="3.6" fill="#FFCC00"></circle>
          </svg>
        </span>
        <span class="vd-wordmark">h2<em>dev</em></span>
      </a>
      <div>
        <h1 id="learn-title" class="h2-shell-title">Lộ trình học</h1>
        <span id="learnCount" class="h2-shell-brand__tag">không cần đăng nhập</span>
      </div>
    </div>
    <div class="header-right">
      <div class="progress-pill">
        <div id="progressRingWrap"></div>
        <div class="progress-text" id="progressText"></div>
      </div>
      <button type="button" class="back-home" id="btnHistoryBack" title="Quay lại trang trước"><span class="h2-icon h2-icon--14" data-h2i="arrow-left" aria-hidden="true"></span> Quay lại</button>
      <a href="/" class="back-home" target="_top" title="Về trang chủ">Trang chủ</a>
    </div>
  </header>

  <div class="resume-banner hidden" id="resumeBanner"></div>

  <!-- PHASE 2: nav tab chuan ARIA (them role/aria-selected/aria-controls roving tabindex) -->
  <nav class="tabbar" id="tabbar" role="tablist" aria-label="Chế độ xem lộ trình">
    <button class="tab-btn active" data-tab="danhmuc" type="button" role="tab" aria-selected="true" aria-controls="panelRoot" tabindex="0">Danh mục bài học</button>
    <button class="tab-btn" data-tab="moi" type="button" role="tab" aria-selected="false" aria-controls="panelRoot" tabindex="-1">Mới cập nhật</button>
    <button class="tab-btn" data-tab="yeuthich" type="button" role="tab" aria-selected="false" aria-controls="panelRoot" tabindex="-1">Yêu thích</button>
    <button class="tab-btn" data-tab="timkiem" type="button" role="tab" aria-selected="false" aria-controls="panelRoot" tabindex="-1">Tìm kiếm bài học</button>
  </nav>

  <main class="learn-content" id="panelRoot" role="tabpanel" aria-live="polite" tabindex="-1"></main>

  <footer class="learn-footer h2-shell-footer">
    H2DEV · kho faceless YouTube · không cần đăng nhập
  </footer>

  <script src="assets/app/learn-main.js?v=20260924-p40"></script>
  <script src="/assets/h2dev-core.js?v=20260924-p40"></script>
  <script src="/assets/learn.js?v=20260924-p40"></script>
  <!-- PHASE 2: Back-to-top chuan (dung class .h2-shell-backtotop, dong bo index/player) -->
  <button id="btn-back-to-top" type="button" class="h2-shell-backtotop" aria-label="Cuộn lên đầu trang" title="Cuộn lên đầu trang">
    <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M5 10l7-7m0 0l7 7m-7-7v18"/></svg>
  </button>
  <!-- P0: vung toast chuan (dong bo 3 trang) + vung thong bao a11y cap trang -->
  <div id="toast-box" role="status" aria-live="polite" aria-atomic="true"></div>
  <div id="a11y-status" aria-live="polite" aria-atomic="true" class="sr-only"></div>
</body>
</html>
